# ==================================================================================================================== #
# Licenses a package index can't answer for, and the projects' own LICENSE files.                                      #
#                                                                                                                      #
# The 'dependency-table' directive resolves a package's license from what the index publishes, and warns at            #
# the end of a build about every package it couldn't resolve. That warning is the list the 'license:' entries          #
# below answer - each was read from the project's own LICENSE file or source headers, not guessed at.                  #
#                                                                                                                      #
# 'licenseURL:' answers a different question. Without one, a license links to where the license itself is              #
# published - apache.org, opensource.org, spdx.org - which says what the license is but not that this project          #
# adopted it. The project's own LICENSE file says both, so it wins where it is known. Most of these come from          #
# the hand-written table this directive replaced; every one was re-checked and answers 200, and the one that           #
# had rotted (sphinxcontrib-mermaid, moved from LICENSE.rst to LICENSE) is corrected here.                             #
#                                                                                                                      #
# SPDX-License-Identifier: Apache-2.0                                                                                  #
# ==================================================================================================================== #
# Structure of this file, checked against 'LicenseOverrides.SCHEMA_VERSION'. Quoted, so YAML keeps it a string:
# unquoted it is a float, and a float loses a trailing zero.
version: "0.1"

# The day these statements were last checked against the projects themselves. A package index answers for itself
# every time it is asked; this file is as old as whoever last looked.
analysedAt: 2026-09-04

packages:
  # 'license: Apache 2' is a name, not an identifier. LICENSE.txt is the Apache License 2.0.
  aiohttp:
    license:    Apache-2.0
    licenseURL: https://GitHub.com/aio-libs/aiohttp/blob/master/LICENSE.txt

  # Publishes no license information at all. LICENSE is the Apache License 2.0.
  anytree:
    license:    Apache-2.0
    licenseURL: https://GitHub.com/c0fec0de/anytree/blob/main/LICENSE

  # 'project_urls' points at the documentation, so the repository has to be stated.
  autoapi:
    repository: https://GitHub.com/carlos-jenkins/autoapi
    licenseURL: https://GitHub.com/carlos-jenkins/autoapi/blob/master/LICENSE

  # Only 'License :: OSI Approved :: BSD License', which means BSD-2-Clause as well. LICENSE.txt is the 3-clause one.
  colorama:
    license:    BSD-3-Clause
    licenseURL: https://GitHub.com/tartley/colorama/blob/master/LICENSE.txt

  # The 'license' field holds the license's full text, and the classifier is the ambiguous BSD one.
  doubly-py-linked-list:
    license: BSD-3-Clause

  # 'GNU General Public License (GPL)' names no version. The source headers say "version 2 [...] or (at your option)
  # any later version".
  igraph:
    license:    GPL-2.0-or-later
    licenseURL: https://GitHub.com/igraph/python-igraph/blob/main/LICENSE

  # 'MIT License' is the license's name; its identifier is 'MIT'.
  sphinx-copybutton:
    license:    MIT
    licenseURL: https://GitHub.com/executablebooks/sphinx-copybutton/blob/master/LICENSE

  # 'Apache-2.0 license' is an identifier with a word after it.
  types-colorama:
    license: Apache-2.0

  # -------------------------------------------------------------------------------------------------------------- #
  # Licenses the index resolves on its own. Only the link to the project's own LICENSE file is stated here.          #
  # -------------------------------------------------------------------------------------------------------------- #
  coverage:
    licenseURL: https://GitHub.com/nedbat/coveragepy/blob/master/LICENSE.txt

  itertree:
    licenseURL: https://GitHub.com/BR1py/itertree/blob/main/LICENSE

  lxml:
    licenseURL: https://GitHub.com/lxml/lxml/blob/master/LICENSE.txt

  mypy:
    licenseURL: https://GitHub.com/python/mypy/blob/master/LICENSE

  networkx:
    licenseURL: https://GitHub.com/networkx/networkx/blob/main/LICENSE.txt

  pytest:
    licenseURL: https://GitHub.com/pytest-dev/pytest/blob/main/LICENSE

  pytest-benchmark:
    licenseURL: https://GitHub.com/ionelmc/pytest-benchmark/blob/master/LICENSE

  pytest-cov:
    licenseURL: https://GitHub.com/pytest-dev/pytest-cov/blob/master/LICENSE

  pyTooling:
    licenseURL: https://GitHub.com/pyTooling/pyTooling/blob/main/LICENSE.md

  ruamel.yaml:
    licenseURL: https://sourceforge.net/p/ruamel-yaml/code/ci/default/tree/LICENSE

  setuptools:
    licenseURL: https://GitHub.com/pypa/setuptools/blob/main/LICENSE

  sphinx:
    licenseURL: https://GitHub.com/sphinx-doc/sphinx/blob/master/LICENSE.rst

  sphinx-autodoc-typehints:
    licenseURL: https://GitHub.com/agronholm/sphinx-autodoc-typehints/blob/master/LICENSE

  sphinx-design:
    licenseURL: https://GitHub.com/executablebooks/sphinx-design/blob/main/LICENSE

  sphinx-reports:
    licenseURL: https://GitHub.com/pyTooling/sphinx-reports/blob/main/LICENSE.md

  sphinx-rtd-theme:
    licenseURL: https://GitHub.com/readthedocs/sphinx_rtd_theme/blob/master/LICENSE

  # The hand-written table linked LICENSE.rst, which is a 404 now - the file is LICENSE.
  sphinxcontrib-mermaid:
    licenseURL: https://GitHub.com/mgaitan/sphinxcontrib-mermaid/blob/master/LICENSE

  treelib:
    licenseURL: https://GitHub.com/caesar0301/treelib/blob/master/LICENSE

  twine:
    licenseURL: https://GitHub.com/pypa/twine/blob/main/LICENSE

  typing-extensions:
    licenseURL: https://GitHub.com/python/typing_extensions/blob/main/LICENSE

  wheel:
    licenseURL: https://GitHub.com/pypa/wheel/blob/main/LICENSE.txt
